apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olympus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/harish2k01/olympus
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: olympus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
