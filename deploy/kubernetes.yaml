apiVersion: v1
kind: Namespace
metadata:
  name: olympus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: olympus
  namespace: olympus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olympus-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, events]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [backuptargets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olympus-readonly
subjects:
  - kind: ServiceAccount
    name: olympus
    namespace: olympus
roleRef:
  kind: ClusterRole
  name: olympus-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olympus-backend
  namespace: olympus
spec:
  replicas: 1
  selector:
    matchLabels: {app: olympus-backend}
  template:
    metadata:
      labels: {app: olympus-backend}
    spec:
      serviceAccountName: olympus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/harish2k01/olympus-backend:f2ada9041c1b54ac60a3c845754bc5d72a75c063
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - secretRef: {name: olympus-auth}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: olympus-backend
  namespace: olympus
spec:
  selector: {app: olympus-backend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: olympus
  namespace: olympus
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [olympus.k8s.harish2k01.xyz]
  rules:
    - backendRefs:
        - name: olympus-backend
          port: 8080
