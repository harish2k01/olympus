apiVersion: v1
kind: Namespace
metadata:
  name: olympus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: olympus
  namespace: olympus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olympus-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, events, pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
  - apiGroups: [longhorn.io]
    resources: [backuptargets, volumes]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olympus-readonly
subjects:
  - kind: ServiceAccount
    name: olympus
    namespace: olympus
roleRef:
  kind: ClusterRole
  name: olympus-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: olympus-backend
  namespace: olympus
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: olympus-backend}
  template:
    metadata:
      labels: {app: olympus-backend}
    spec:
      serviceAccountName: olympus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/harish2k01/olympus-backend:d13c81803d37663ad4eb350013627b2cc3e60056
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - secretRef: {name: olympus-auth}
          env:
            - {name: HISTORY_FILE, value: /data/events.json}
          volumeMounts:
            - {name: history, mountPath: /data}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
      volumes:
        - name: history
          persistentVolumeClaim: {claimName: olympus-history}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: olympus-history
  namespace: olympus
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: olympus-backend
  namespace: olympus
spec:
  selector: {app: olympus-backend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: olympus
  namespace: olympus
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames: [olympus.k8s.harish2k01.xyz]
  rules:
    - backendRefs:
        - name: olympus-backend
          port: 8080
