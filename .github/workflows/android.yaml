name: Android checks
on:
  push:
    branches: [main]
    paths: [app/**, gradle/**, '*.gradle.kts', gradle.properties, .github/workflows/android.yaml]
  pull_request:
    paths: [app/**, gradle/**, '*.gradle.kts', gradle.properties, .github/workflows/android.yaml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install compile tools
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
