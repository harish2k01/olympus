name: Backend tests
on:
  pull_request:
    paths: [backend/**, .github/workflows/backend-test.yaml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./... && go test ./...
        working-directory: backend
